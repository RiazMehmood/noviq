# whisper-sidecar — STT subprocess for the Meeting Agent.
#
# Lives in its own Cargo project (NOT a workspace member of src-tauri) so its
# bundled ggml symbols never collide with llama-cpp-2's bundled ggml at link
# time. The main app spawns this binary and exchanges NDJSON over stdin/stdout.
#
# Build: cd sidecars/whisper-sidecar && cargo build --release
# (Tauri externalBin will pick up the binary from src-tauri/binaries/.)
[package]
name = "whisper-sidecar"
version = "0.1.0"
edition = "2021"
rust-version = "1.87"

[[bin]]
name = "whisper-sidecar"
path = "src/main.rs"

[dependencies]
# Whisper FFI — bundles its own ggml. Process isolation prevents linker
# conflict with llama-cpp-sys-2 in the main app.
whisper-rs = "0.13"

# NDJSON IPC over stdio
serde      = { version = "1", features = ["derive"] }
serde_json = "1"
anyhow     = "1"

# WAV decoding for batch transcription requests; streaming PCM is accepted as
# raw little-endian f32 frames over stdin and bypasses this dep.
hound = "3.5"

# Base64 for inline audio chunks in JSON commands.
base64 = "0.22"

[profile.release]
lto = "thin"
codegen-units = 1
strip = true
